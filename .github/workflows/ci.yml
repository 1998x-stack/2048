name: Python game checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install runtime dependency
        run: python -m pip install 'pygame>=2.5,<3'
      - name: Compile source
        run: python -m compileall -q src config main.py
      - name: Run headless tests
        run: bash run_tests.sh
